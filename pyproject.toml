[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padforge"
version = "1.0.0"
description = "Universal gamepad modernization layer for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MukaSanches"}]
dependencies = [
  "pygame>=2.5,<3",
  "vgamepad>=0.1.0",
  "psutil>=5.9"
]

[project.scripts]
padforge = "padforge.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["padforge*"]
