name: Build and Test
on:
  push:
    branches: [main]
  pull_request:

env:
  VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q padforge main.py

  build-installer:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Build PadForge.exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm PadForge.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build PadForge installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PadForge.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PadForge-1.0.1-Windows
          if-no-files-found: error
          path: |
            dist/PadForge.exe
            dist-installer/PadForge-Setup-1.0.1.exe
